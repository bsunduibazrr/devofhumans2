<!doctype html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Бидний эрх хаана</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&family=Onest:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --paper: #f3ede2;
        --ink: #15312a;
        --ink-2: #3c524a;
        --mute: #7f8c83;
        --rule: #d6cdbb;
        --accent: #b8612f;
        --serif:
          "Cormorant Garamond", "Cormorant", Georgia, "Times New Roman", serif;
        --sans: "Onest", "Helvetica Neue", Arial, sans-serif;
        --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
        --u: min(1vw, 1.72vh);
        --gutter: max(16px, calc(var(--u) * 5.2));
        --ease: cubic-bezier(0.19, 1, 0.22, 1);
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
      }
      html {
        background: var(--paper);
      }
      body {
        margin: 0;
        background: var(--paper);
        color: var(--ink);
        font-family: var(--sans);
        font-size: max(15px, calc(var(--u) * 1.32));
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        overscroll-behavior: none;
      }
      ::selection {
        background: var(--ink);
        color: var(--paper);
      }
      em {
        font-style: italic;
      }
      h1,
      h2,
      h3,
      p,
      ul {
        margin: 0;
      }
      h1,
      h2,
      h3 {
        font-weight: 300;
        text-wrap: balance;
      }
      :focus-visible {
        outline: 1.5px solid var(--ink);
        outline-offset: 4px;
      }
